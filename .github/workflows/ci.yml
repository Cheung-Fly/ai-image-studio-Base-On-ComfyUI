name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend types
        working-directory: frontend
        run: npm run typecheck

      - name: Build Vue frontend
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: >-
          python -m pip install
          "mcp>=1.2,<2"
          "pydantic-settings>=2.2"
          "fastapi>=0.110,<1.0"
          "sqlalchemy>=2.0.25"
          "httpx>=0.27"
          "celery>=5.4"
          "redis>=5.0"
          "pillow>=10.0"
          "openpyxl>=3.1,<4"
          "imageio-ffmpeg>=0.5.1,<1.0"
          pytest
          ruff

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app

      - name: Import MCP API routes
        working-directory: backend
        run: python -c "from app.api.agent import router; from app.api.chat import router as chat_router; from app.api.director import router as director_router; from app.api.generate import router as generate_router; from app.api.instance import router as instance_router; from app.api.runninghub import router as runninghub_router; from app.api.tasks import router as tasks_router; from app.api.video import router as video_router"

      - name: Lint changed backend areas
        run: >-
          ruff check
          backend/app/api/agent.py
          backend/app/api/chat.py
          backend/app/api/director.py
          backend/app/api/generate.py
          backend/app/api/instance.py
          backend/app/api/runninghub.py
          backend/app/api/tasks.py
          backend/app/api/video.py
          backend/app/mcp_server
          backend/app/services/comfy_client.py
          backend/app/services/director_agent.py
          backend/app/services/task_reliability.py
          backend/app/services/agents.py
          backend/app/services/llm_client.py
          backend/app/services/mcp_agent.py
          backend/app/services/quality_review.py
          backend/app/services/runninghub.py
          backend/app/services/agent_memory.py
          backend/app/workers/tasks.py
          backend/app/schemas.py
          backend/app/models.py
          backend/app/database.py
          backend/tests/test_mcp_agent.py
          backend/tests/test_agent_memory.py
          backend/tests/test_chat_stream.py
          backend/tests/test_quality_review.py
          backend/tests/test_runninghub.py
          backend/tests/test_director_agent.py
          backend/tests/test_task_reliability.py

      - name: Test MCP Agent with mocked ComfyUI
        working-directory: backend
        run: python tests/test_mcp_agent.py

      - name: Test personal preference memory
        working-directory: backend
        run: python -m tests.test_agent_memory

      - name: Test streamed chat
        working-directory: backend
        run: python -m tests.test_chat_stream

      - name: Test quality review Harness
        working-directory: backend
        run: python -m pytest -q tests/test_quality_review.py

      - name: Test RunningHub workflow backend
        working-directory: backend
        run: python -m tests.test_runninghub

      - name: Test task reliability
        working-directory: backend
        run: python -m unittest tests.test_task_reliability

      - name: Test Director Agent
        working-directory: backend
        run: python -m unittest tests.test_director_agent

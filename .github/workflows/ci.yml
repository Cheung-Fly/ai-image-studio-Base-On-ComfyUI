name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: >-
          python -m pip install
          "mcp>=1.2,<2"
          "pydantic-settings>=2.2"
          "fastapi>=0.110,<1.0"
          "sqlalchemy>=2.0.25"
          "celery>=5.4"
          "redis>=5.0"
          "pillow>=10.0"
          ruff

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app

      - name: Import MCP API routes
        working-directory: backend
        run: python -c "from app.api.agent import router; from app.api.chat import router as chat_router"

      - name: Lint changed backend areas
        run: >-
          ruff check
          backend/app/api/agent.py
          backend/app/api/chat.py
          backend/app/mcp_server
          backend/app/services/comfy_client.py
          backend/app/services/llm_client.py
          backend/app/services/mcp_agent.py
          backend/app/services/agent_memory.py
          backend/app/workers/tasks.py
          backend/app/schemas.py
          backend/app/models.py
          backend/tests/test_mcp_agent.py
          backend/tests/test_agent_memory.py
          backend/tests/test_chat_stream.py

      - name: Test MCP Agent with mocked ComfyUI
        working-directory: backend
        run: python tests/test_mcp_agent.py

      - name: Test personal preference memory
        working-directory: backend
        run: python -m tests.test_agent_memory

      - name: Test streamed chat
        working-directory: backend
        run: python -m tests.test_chat_stream

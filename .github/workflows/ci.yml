name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install "mcp>=1.2,<2" "pydantic-settings>=2.2" ruff

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app

      - name: Lint changed backend areas
        run: >-
          ruff check
          backend/app/api/agent.py
          backend/app/mcp_server
          backend/app/services/comfy_client.py
          backend/app/services/llm_client.py
          backend/app/services/mcp_agent.py
          backend/app/workers/tasks.py
          backend/tests/test_mcp_agent.py

      - name: Test MCP Agent with mocked ComfyUI
        working-directory: backend
        run: python tests/test_mcp_agent.py

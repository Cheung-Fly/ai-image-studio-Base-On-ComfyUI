services:
  redis:
    image: redis:7-alpine
    container_name: aistudio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aistudio-api
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - COMFYUI_BASE_URL=http://host.docker.internal:8188
      - DATABASE_URL=sqlite:////data/aistudio.db
      - IMAGE_STORAGE_DIR=/data/images
      - WORKFLOW_DIR=/workflows
      - COMFYUI_LORAS_DIR=/comfyui/loras
      - LLAMA_BASE_URL=http://host.docker.internal:8080/v1
      - LLAMA_API_KEY=not-needed
      - DEFAULT_LLM_PROVIDER=llama
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
      - "D:/AI_MOVIE/ComfyUI_windows_portable/ComfyUI/models/loras:/comfyui/loras"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aistudio-worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - COMFYUI_BASE_URL=http://host.docker.internal:8188
      - DATABASE_URL=sqlite:////data/aistudio.db
      - IMAGE_STORAGE_DIR=/data/images
      - WORKFLOW_DIR=/workflows
      - LLAMA_BASE_URL=http://host.docker.internal:8080/v1
      - LLAMA_API_KEY=not-needed
      - DEFAULT_LLM_PROVIDER=llama
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

volumes:
  redis-data:
